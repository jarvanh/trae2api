name: build-release

# 自动构建版本：push main / push tag 自动发版，也可手动指定版本号。
# 产物是 Go 静态二进制（服务端 + 签到/积分工具），部署侧直接取用，无需在目标机编译或 docker build。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空自动生成，如 v2026.09.22-91cb7a5）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23' # 与 Dockerfile 的 golang:1.23-alpine 对齐
          cache: true

      - name: 计算版本号
        id: ver
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="v$(date -u +%Y.%m.%d)-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "构建版本: ${VER}"

      - name: 构建二进制
        run: |
          set -euo pipefail
          mkdir -p dist
          # 服务端主程序（与 Dockerfile 同一入口 ./cmd/server）
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -trimpath -ldflags="-s -w" \
              -o "dist/trae2api-linux-${arch}" ./cmd/server
          done
          # 运维辅助工具（签到 / 积分报表）
          for tool in checkin credit; do
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -ldflags="-s -w" \
              -o "dist/trae2api-${tool}-linux-amd64" "./cmd/${tool}"
          done

      - name: 生成校验和
        run: |
          set -euo pipefail
          cd dist && sha256sum ./* > SHA256SUMS && cat SHA256SUMS

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: trae2api ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
